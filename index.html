<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgFlow - CFOP Speedcubing Trainer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider text-emerald-400">Alg<span class="text-white">Flow</span></h1>
            <span class="text-xs bg-gray-700 px-3 py-1 rounded-full text-gray-400 font-mono">v1.0 Prototipo</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:py-8">
        
        <div class="flex bg-gray-800 rounded-xl p-1 mb-6 border border-gray-700 shadow-inner">
            <button onclick="switchTab('database')" id="tab-database" class="tab-btn flex-1 py-3 text-center rounded-lg font-bold text-sm transition-all bg-emerald-500 text-gray-900 shadow">
                📊 Database & Frequenze
            </button>
            <button onclick="switchTab('trainer')" id="tab-trainer" class="tab-btn flex-1 py-3 text-center rounded-lg font-bold text-sm text-gray-400 transition-all hover:text-white">
                🧠 Smart Trainer
            </button>
        </div>

        <section id="content-database" class="tab-content active space-y-6">
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700">
                <p class="text-sm text-gray-400 leading-relaxed">
                    💡 Gli algoritmi sono ordinati in base alla loro **probabilità statistica reale su 100 risoluzioni**. Concentrati prima sui gruppi ad alta frequenza per abbassare drasticamente i tuoi tempi.
                </p>
            </div>

            <div id="alg-container" class="space-y-4"></div>
        </section>

        <section id="content-trainer" class="tab-content space-y-6">
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 text-center max-w-md mx-auto shadow-xl">
                <span class="text-xs font-bold uppercase tracking-widest text-emerald-400 bg-emerald-950 px-3 py-1 rounded-full border border-emerald-800" id="trainer-priority">
                    Priorità
                </span>
                
                <h3 class="text-4xl font-black my-6 tracking-wide text-white" id="trainer-case-name">---</h3>
                
                <div class="bg-gray-950 p-4 rounded-xl font-mono text-sm border border-gray-800 min-h-[60px] flex items-center justify-center mb-6 hidden" id="trainer-alg-box">
                    <span class="text-yellow-400 text-lg font-bold" id="trainer-alg-text"></span>
                </div>

                <div class="space-y-3">
                    <button onclick="toggleAlg()" class="w-full bg-gray-700 hover:bg-gray-600 font-bold py-3 px-4 rounded-xl transition-all cursor-pointer">
                        👀 Mostra/Nascondi Algoritmo
                    </button>
                    <button onclick="nextRandomCase()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-gray-900 font-black py-4 px-4 rounded-xl transition-all shadow-lg cursor-pointer">
                        Prossimo Caso 🚀
                    </button>
                </div>
                
                <p class="text-xs text-gray-500 mt-4 font-mono" id="trainer-stats"></p>
            </div>
        </section>

    </main>

    <script>
        // Database ottimizzato: Nomi, Frequenze reali su 100 casi, e algoritmi rotationless moderni
        const pllDatabase = [
            { id: "ga", name: "G-Perm (Ga)", freq: "5.5%", priority: "Alta", alg: "(R2 U R' U) (R' U' R U') R2 (D U' R' U R D')" },
            { id: "gb", name: "G-Perm (Gb)", freq: "5.5%", priority: "Alta", alg: "(F' U' F) (R2 u R' U) (R U' R u') R2" },
            { id: "gc", name: "G-Perm (Gc)", freq: "5.5%", priority: "Alta", alg: "(R2 U' R U') (R U R' U) R2 (D' U R U' R' D)" },
            { id: "gd", name: "G-Perm (Gd)", freq: "5.5%", priority: "Alta", alg: "(F R U' R') U' (R U R2 F') (R U R' U') R" },
            { id: "ua", name: "U-Perm (Ua)", freq: "5.5%", priority: "Alta", alg: "(R U' R U) (R U R U') (R' U' R2)" },
            { id: "ub", name: "U-Perm (Ub)", freq: "5.5%", priority: "Alta", alg: "(R2 U R U' R' U' R' U' R U' R)" },
            { id: "aa", name: "A-Perm (Aa)", freq: "3.7%", priority: "Media", alg: "x (R' U R') D2 (R U' R') D2 R2 x'" },
            { id: "ab", name: "A-Perm (Ab)", freq: "3.7%", priority: "Media", alg: "x (R2 D2) (R U R') D2 (R U' R) x'" },
            { id: "t",  name: "T-Perm",      freq: "4.1%", priority: "Media", alg: "(R U R' U') (R' F R2 U') R' U' (R U R' F')" },
            { id: "j",  name: "J-Perm (Jb)", freq: "4.1%", priority: "Media", alg: "(R U R' F') (R U R' U') R' F R2 U' R'" },
            { id: "y",  name: "Y-Perm",      freq: "4.1%", priority: "Media", alg: "F (R U' R' U') (R U R' F') (R U R' U') (R' F R F')" },
            { id: "z",  name: "Z-Perm",      freq: "2.8%", priority: "Bassa", alg: "M2' U M2' U M' U2 M2' U2 M'" },
            { id: "e",  name: "E-Perm",      freq: "2.8%", priority: "Bassa", alg: "x' (R U' R' D) (R U R' D') (R U R' D) (R U' R' D') x" },
            { id: "h",  name: "H-Perm",      freq: "1.4%", priority: "Rara",  alg: "M2' U M2' U2 M2' U M2'" },
            { id: "na", name: "N-Perm (Na)", freq: "1.4%", priority: "Rara",  alg: "(R U R' U) (R U R' F' R U R' U' R' F R2 U' R') U2 R U' R'" }
        ];

        // Funzione per renderizzare la lista ordinata nel Database
        function renderDatabase() {
            const container = document.getElementById('alg-container');
            container.innerHTML = '';

            // Ordina l'array per frequenza decrescente
            const sortedDb = [...pllDatabase].sort((a, b) => parseFloat(b.freq) - parseFloat(a.freq));

            sortedDb.forEach(item => {
                let badgeColor = "bg-gray-700 text-gray-300";
                if(item.priority === "Alta") badgeColor = "bg-red-950 text-red-400 border border-red-900";
                if(item.priority === "Media") badgeColor = "bg-yellow-950 text-yellow-400 border border-yellow-900";
                if(item.priority === "Bassa") badgeColor = "bg-blue-950 text-blue-400 border border-blue-900";

                const card = `
                    <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-sm hover:border-gray-600 transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="text-lg font-bold text-white">${item.name}</h4>
                                <span class="text-xs font-mono font-bold text-emerald-400">Frequenza: ${item.freq} su 100 solve</span>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md ${badgeColor}">
                                ${item.priority}
                            </span>
                        </div>
                        <div class="bg-gray-900 p-3 rounded-lg font-mono text-sm text-gray-300 border border-gray-800 mt-2 select-all break-words">
                            ${item.alg}
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Sistema di Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-emerald-500', 'text-gray-900', 'shadow');
                el.classList.add('text-gray-400');
            });

            document.getElementById(`content-${tabName}`).classList.add('active');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.add('bg-emerald-500', 'text-gray-900', 'shadow');
            activeBtn.classList.remove('text-gray-400');

            if(tabName === 'trainer') {
                nextRandomCase();
            }
        }

        // Logica dello Smart Trainer (Algoritmo di estrazione pesata)
        let currentCase = null;

        function nextRandomCase() {
            // Estrazione casuale semplice per il prototipo
            const randomIndex = Math.floor(Math.random() * pllDatabase.length);
            currentCase = pllDatabase[randomIndex];

            document.getElementById('trainer-case-name').innerText = currentCase.name;
            document.getElementById('trainer-priority').innerText = `${currentCase.priority} (Probabilità: ${currentCase.freq})`;
            document.getElementById('trainer-alg-text').innerText = currentCase.alg;
            
            // Nasconde l'algoritmo di default per costringerti a ricordarlo
            document.getElementById('trainer-alg-box').classList.add('hidden');
        }

        function toggleAlg() {
            const box = document.getElementById('trainer-alg-box');
            box.classList.toggle('hidden');
        }

        // Inizializzazione al caricamento
        window.onload = () => {
            renderDatabase();
        };
    </script>
</body>
</html>
